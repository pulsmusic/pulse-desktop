.logo sup { position:absolute; right:-34px; top:-6px; font-size:11px; font-weight:700; color:var(--ink2); }

.step.done { color:var(--ink2); } .step.done .n { border-color:transparent; background:rgba(255,255,255,.12); color:var(--ink); }
.step.on { color:var(--accent); } .step.on .n { border-color:transparent; background:var(--accent); color:#06201f; }

.main { position:fixed; left:276px; right:30px; top:26px; bottom:24px; display:flex; flex-direction:column; }
.scr { display:flex; flex-direction:column; flex:1; min-height:0; }
.scr > * { animation:rise .6s var(--ease) both; }
.scr > *:nth-child(2) { animation-delay:.05s; } .scr > *:nth-child(3) { animation-delay:.1s; } .scr > *:nth-child(4) { animation-delay:.15s; } .scr > *:nth-child(5) { animation-delay:.2s; } .scr > *:nth-child(6) { animation-delay:.25s; }
.scr.out > * { animation:out .25s var(--io) both; }
@keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
@keyframes out { to { opacity:0; transform:translateY(-8px); } }
@keyframes inL { from { opacity:0; transform:translateX(-14px); } to { opacity:1; transform:none; } }

.cap { font-size:12px; font-weight:700; letter-spacing:.7px; color:var(--ink3); text-transform:uppercase; }
h1 { font-family:'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif; font-size:34px; line-height:40px; font-weight:700; letter-spacing:-.6px; margin-top:6px; }
.sub { margin-top:8px; font-size:15px; line-height:22px; color:var(--ink2); max-width:540px; }
.card { border-radius:22px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.07); }
.feat { display:flex; align-items:center; gap:14px; padding:12px 16px; }
.feat + .feat { border-top:1px solid rgba(255,255,255,.06); }
.ico { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:var(--pill); color:var(--accent); flex-shrink:0; }
.feat b, .row b { display:block; font-size:15px; line-height:20px; font-weight:600; } .feat small, .row small { display:block; font-size:13px; line-height:18px; color:var(--ink3); }
.foot { margin-top:auto; padding-top:14px; display:flex; align-items:center; gap:10px; }
.foot .note { flex:1; font-size:12px; line-height:17px; color:var(--ink3); }
.btn { height:52px; padding:0 26px; border-radius:26px; display:inline-flex; align-items:center; gap:10px; font-size:15px; font-weight:600; transition:transform .15s var(--io), background-color .2s; white-space:nowrap; }
.btn:active { transform:scale(.97); }
.btn.pri { background:#f5f5f7; color:#111114; } .btn.pri:hover { background:#fff; }
.btn.ghost { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.08); } .btn.ghost:hover { background:rgba(255,255,255,.13); }
.btn[disabled] { opacity:.45; pointer-events:none; }
.lbl { font-size:13px; font-weight:600; color:var(--ink3); margin:0 0 8px 6px; }
.field { height:52px; border-radius:26px; display:flex; align-items:center; gap:12px; padding:0 8px 0 18px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); }
.field .p { flex:1; min-width:0; height:100%; font:inherit; font-size:14px; color:var(--ink); background:none; border:0; outline:none; user-select:text; cursor:text; }
.field:focus-within { border-color:rgba(var(--rgb),.6); box-shadow:0 0 0 3px rgba(var(--rgb),.18); }
.field .spill[disabled] { opacity:.55; }
.hint2 { margin:8px 0 0 6px; font-size:12px; color:var(--ink3); min-height:16px; }
.spill { height:36px; padding:0 16px; border-radius:18px; display:inline-flex; align-items:center; font-size:14px; font-weight:600; background:rgba(255,255,255,.10); flex-shrink:0; }
.spill:hover { background:rgba(255,255,255,.16); } .spill:active { transform:scale(.97); }
.row { display:flex; align-items:center; gap:14px; min-height:60px; padding:8px 16px; cursor:pointer; }
.row + .row { border-top:1px solid rgba(255,255,255,.06); }
.row .t { flex:1; }
.tg { width:50px; height:30px; border-radius:15px; background:rgba(255,255,255,.16); position:relative; flex-shrink:0; transition:background-color .25s var(--io); }
.tg::after { content:''; position:absolute; left:3px; top:3px; width:24px; height:24px; border-radius:12px; background:#fff; transition:transform .3s var(--ease); }
.tg.on { background:var(--accent); } .tg.on::after { transform:translateX(20px); }

.big { font-family:'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif; font-size:64px; line-height:68px; font-weight:700; letter-spacing:-2px; font-variant-numeric:tabular-nums; }
.big small { font-size:28px; color:var(--ink3); letter-spacing:0; margin-left:4px; }
.comet { position:relative; height:36px; }
.comet .tr { position:absolute; left:0; right:0; top:16px; height:4px; border-radius:2px; background:rgba(255,255,255,.16); }
.comet .tail { position:absolute; left:0; right:0; top:12px; height:12px; transform-origin:0 50%; transform:scaleX(0); transition:transform .4s linear; }
.comet .tail .gl { position:absolute; inset:2px 0; border-radius:4px; opacity:.5; background:linear-gradient(90deg, rgba(var(--rgb),0) 30%, rgba(var(--rgb),.45)); }
.comet .tail .ln { position:absolute; left:0; right:0; top:4px; height:4px; border-radius:2px; background:linear-gradient(90deg, rgba(var(--rgb),0), rgba(var(--rgb),.85) 55%, var(--accent)); }
.comet .hw { position:absolute; left:0; right:0; top:0; height:36px; transform:translateX(0); transition:transform .4s linear; pointer-events:none; }

@keyframes pulseStar { 0%,100% { transform:scale(1); } 50% { transform:scale(1.12); } }
.s1 { width:40px; height:40px; margin:-20px; opacity:.22; } .s2 { width:31px; height:31px; margin:-15.5px; opacity:.42; } .s3 { width:24px; height:24px; margin:-12px; } .core { width:10px; height:10px; margin:-5px; background:#fff !important; }
.li { display:flex; align-items:center; gap:12px; height:44px; padding:0 16px; font-size:14px; color:var(--ink3); transition:color .3s; }
.li .d { width:24px; height:24px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:2px solid rgba(255,255,255,.2); transition:all .3s var(--io); }
.li.ok .d { border-color:transparent; background:rgba(255,255,255,.12); color:var(--ink); }
.li.now { color:var(--ink); font-weight:600; } .li.now .d { border-color:transparent; background:var(--accent); color:#06201f; }
.li .r { margin-left:auto; font-size:13px; color:var(--ink3); font-weight:500; font-variant-numeric:tabular-nums; }
.eq { display:inline-flex; gap:2px; align-items:flex-end; height:12px; } .eq i { width:3px; height:12px; border-radius:2px; background:#06201f; transform-origin:50% 100%; animation:eq .9s ease-in-out infinite alternate; }
.eq i:nth-child(2) { animation-delay:-.3s; } .eq i:nth-child(3) { animation-delay:-.6s; }
@keyframes eq { from { transform:scaleY(.3); } to { transform:scaleY(1); } }
.err { margin-top:16px; border-radius:22px; padding:16px 18px; background:rgba(255,107,111,.10); border:1px solid rgba(255,107,111,.25); color:#ffc9cb; font-size:14px; line-height:20px; }
.err b { color:#fff; display:block; margin-bottom:4px; }
.donebox { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }

  const old = main.firstElementChild;
  const put = () => { main.innerHTML = '<div class="scr">' + html + '</div>'; side(at); cur = name; bind(); };
  if (old) { old.classList.add('out'); setTimeout(put, 220); } else put();
}

function welcome() {
  const upd = info.installed;
  show('welcome', `
    <div class="cap">${upd ? 'Обновление' : 'Установка'} · альфа ${esc(info.version || '0.9.4')}</div>
    <h1>${upd ? 'Обновим Пульс' : 'Пульс на вашем компьютере'}</h1>
    <div class="sub">Музыка из Яндекс Музыки в дизайне «Пульса»: свет в цвете профиля, стопка «Моего пульса» и живой текст.${upd ? ' Вход, любимые треки и настройки сохранятся.' : ''}</div>
    <div class="card" style="margin-top:22px">
      <div class="feat"><span class="ico">${I.star}</span><span><b>Мой пульс</b><small>Бесконечная стопка треков под ваш вкус — листайте свайпом</small></span></div>
      <div class="feat"><span class="ico">${I.lyr}</span><span><b>Живой текст</b><small>Строки подсвечиваются вместе с песней</small></span></div>
      <div class="feat"><span class="ico">${I.notes}</span><span><b>Ваша музыка</b><small>Любимые треки, недавние и статистика прослушиваний</small></span></div>
    </div>
    <div class="foot"><span class="note">${info.embedded ? 'Всё нужное уже внутри — интернет не понадобится.' : 'Скачается около 110 МБ.'} Займёт около ${gb(info.embedded ? 300 : info.needMB - 110)}.<br>Только для вас — права администратора не нужны.</span>
      <button class="btn ghost" data-go="settings">Настроить</button><button class="btn pri" data-go="install">${upd ? 'Обновить' : 'Установить'}</button></div>`, 0);
}
function settings() {
  show('settings', `
    <div class="cap">Шаг 2 из 4</div>
    <h1>Куда и как установить</h1>
    <div style="margin-top:20px"><div class="lbl">Папка</div><div class="field"><input class="p" id="dir" spellcheck="false" value="${esc(opts.dir)}" aria-label="Папка установки"><button class="spill" data-act="pick">Изменить</button></div><div class="hint2" id="dirhint">Можно выбрать кнопкой «Изменить» или вписать путь вручную</div></div>
    <div class="card" style="margin-top:16px">
      <div class="row" data-tg="desktop"><span class="t"><b>Ярлык на рабочем столе</b><small>«${esc(info.name)}»</small></span><span class="tg ${opts.desktop ? 'on' : ''}"></span></div>
      <div class="row" data-tg="startMenu"><span class="t"><b>В меню «Пуск»</b></span><span class="tg ${opts.startMenu ? 'on' : ''}"></span></div>
      <div class="row" data-tg="autostart"><span class="t"><b>Запускать вместе с Windows</b><small>Пульс откроется сам, когда включите компьютер</small></span><span class="tg ${opts.autostart ? 'on' : ''}"></span></div>
    </div>
    <div class="foot"><span class="note" id="space">Нужно около ${gb(info.embedded ? 300 : info.needMB)} · свободно ${gb(info.freeMB)}</span>
      <button class="btn ghost" data-go="welcome">Назад</button><button class="btn pri" data-go="install">Установить</button></div>`, 1);
}
let LIST = ['Проверка места на диске', 'Скачиваю Electron — основу программы', 'Распаковываю программу', 'Ярлыки и меню «Пуск»'];
function installing() {
  show('install', `
    <div class="cap">Шаг 3 из 4</div>
    <h1 id="ttl">Устанавливаю…</h1>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:18px"><div class="big"><span id="pct">0</span><small>%</small></div><div id="eta" style="font-size:14px;color:var(--ink3);margin-bottom:10px"></div></div>
    <div class="comet" style="margin-top:6px"><div class="tr"></div><div class="tail" id="tail"><i class="gl"></i><i class="ln"></i></div><div class="hw" id="hw"><div class="head"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="core"></i></div></div></div>
    <div class="card" id="list" style="margin-top:18px;padding:6px 0">${LIST.map((s, i) => `<div class="li" data-i="${i}"><span class="d"></span><span class="tx">${s}</span><span class="r"></span></div>`).join('')}</div>
    <div class="foot"><span class="note" id="note">Окно можно свернуть — установка продолжится.</span><button class="btn ghost" data-act="cancel" id="cancel">Отмена</button></div>`, 2);
  startPoll();
}
function done(s) {
  const where = [opts.desktop && 'на рабочем столе', opts.startMenu && 'в меню «Пуск»'].filter(Boolean).join(' и ');
  show('done', `
    <div class="donebox">
      <div class="lstarbig"></div>
      <h1 style="margin-top:18px">Пульс установлен</h1>
      <div class="sub" style="max-width:440px">${where ? 'Ярлык «' + esc(info.name) + '» — ' + where + '. ' : ''}При первом запуске войдите в Яндекс Музыку, чтобы треки играли целиком.</div>
    </div>
    <div class="foot"><span class="note"></span><button class="btn ghost" data-act="quit">Закрыть</button><button class="btn pri" data-act="launch">${I.play}Запустить Пульс</button></div>`, 3);
}

let shownPct = 0;
function startPoll() {
  clearInterval(poll);
  poll = setInterval(async () => {
    let s; try { s = await api('/api/state'); } catch { return; }
    if (cur !== 'install') return;
    const p = Math.max(0, Math.min(100, s.pct || 0));
    shownPct = p;
    const pe = document.getElementById('pct'); if (pe) pe.textContent = Math.floor(p);
    const f = p / 100;
    const tail = document.getElementById('tail'), hw = document.getElementById('hw');
    if (tail) tail.style.transform = 'scaleX(' + Math.max(0.0001, f) + ')';
    if (hw) hw.style.transform = 'translateX(' + (f * hw.offsetWidth) + 'px)';
    const eta = document.getElementById('eta'); if (eta) eta.textContent = s.eta || '';
    document.querySelectorAll('.li').forEach((li) => {
      const i = +li.dataset.i; const d = li.querySelector('.d'), r = li.querySelector('.r');
      const st = s.phase === 'done' || i < s.step ? 'ok' : i === s.step ? 'now' : '';
      if (li.dataset.st !== st) {
        li.dataset.st = st; li.className = 'li ' + st;
        d.innerHTML = st === 'ok' ? I.chk : st === 'now' ? '<span class="eq"><i></i><i></i><i></i></span>' : '';
      }
      r.textContent = st === 'ok' ? (i === 1 && s.cached ? (info.embedded ? 'уже внутри' : 'уже был скачан') : 'готово') : st === 'now' && i === 1 && /МБ/.test(s.detail || '') ? s.detail : '';
    });
    if (s.phase === 'done') { clearInterval(poll); setTimeout(() => done(s), 650); }
    else if (s.phase === 'error') {
      clearInterval(poll);
      document.getElementById('ttl').textContent = 'Не получилось';
      const list = document.getElementById('list');
      if (!document.querySelector('.err')) list.insertAdjacentHTML('afterend', '<div class="err"><b>Установка остановилась</b>' + esc(s.err) + '</div>');
      document.querySelector('.foot').innerHTML = '<span class="note">Можно попробовать ещё раз — уже скачанное не потеряется.</span><button class="btn ghost" data-act="quit">Закрыть</button><button class="btn ghost" data-go="settings">Другая папка</button><button class="btn pri" data-act="retry">Повторить</button>';
      bind();
    } else if (s.phase === 'cancelled') { clearInterval(poll); welcome(); }
  }, 250);
}

function bind() {
  document.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll('[data-tg]').forEach((r) => r.onclick = () => { const k = r.dataset.tg; opts[k] = !opts[k]; r.querySelector('.tg').classList.toggle('on', opts[k]); });
  document.querySelectorAll('[data-act]').forEach((b) => b.onclick = () => act(b.dataset.act, b));
}
function spaceFor(free) { const e = document.getElementById('space'); if (e) e.textContent = 'Нужно около ' + gb(info.embedded ? 300 : info.needMB) + ' · свободно ' + gb(free); }
let freeT = 0;
document.addEventListener('input', (e) => {
  if (e.target.id !== 'dir') return;
  opts.dir = e.target.value.trim();
  clearTimeout(freeT); freeT = setTimeout(async () => { try { const r = await api('/api/free?dir=' + encodeURIComponent(opts.dir)); spaceFor(r.freeMB); } catch (er) {} }, 400);
});
async function go(where) {
  if (where === 'settings') settings();
  else if (where === 'welcome') welcome();
  else if (where === 'install') { await api('/api/install', opts); installing(); }
}
async function act(a, b) {
  if (a === 'pick') {
    b.disabled = true; b.textContent = 'Открываю…';
    const h = document.getElementById('dirhint'); h.textContent = 'Выберите папку в открывшемся окне';
    let r = {}; try { r = await api('/api/pickdir?dir=' + encodeURIComponent(opts.dir)); } catch (e) {}
    b.disabled = false; b.textContent = 'Изменить';
    if (r.dir) { opts.dir = r.dir; document.getElementById('dir').value = r.dir; spaceFor(r.freeMB); h.textContent = 'Пульс установится в эту папку'; }
    else h.textContent = r.err ? 'Окно выбора не открылось — впишите путь вручную' : 'Папка не изменилась';
  } else if (a === 'cancel') { b.disabled = true; await api('/api/cancel', {}); }
  else if (a === 'retry') { await api('/api/install', opts); installing(); }
  else if (a === 'launch') { b.disabled = true; await api('/api/launch', {}); setTimeout(() => window.close(), 300); }
  else if (a === 'quit') { quitting = true; await api('/api/quit', {}); window.close(); }
}
let quitting = false;
addEventListener('pagehide', () => { if (!quitting) navigator.sendBeacon('/api/quit?t=' + TOKEN); });
addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id !== 'dir') { const p = document.querySelector('.foot .btn.pri'); if (p) p.click(); } });
addEventListener('contextmenu', (e) => { if (e.target.id !== 'dir') e.preventDefault(); });
addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
// подстраховка: окно нужного размера и по центру (если браузер разрешит)
try { if (Math.abs(outerWidth - 960) > 80 || Math.abs(outerHeight - 660) > 80) { resizeTo(960, 660); moveTo((screen.availWidth - 960) / 2, (screen.availHeight - 660) / 2); } } catch (e) {}
(async () => {
  try { info = await api('/api/info'); } catch (e) {}
  if (info.version) document.getElementById('build').textContent = 'Альфа-билд ' + info.version;
  opts.dir = info.dir;
  if (info.embedded) LIST[1] = 'Electron — основа программы';
  welcome();
})();
</script>
</body></html>
