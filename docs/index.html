.glow{position:absolute;pointer-events:none;border-radius:50%;filter:blur(90px)}
.page{position:relative;display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:48px;max-width:1440px;margin:0 auto;padding:40px 0 48px 56px;min-height:100vh;overflow:hidden}
.l{min-width:0;display:flex;flex-direction:column;gap:22px;position:relative;z-index:2}
.l .logo{width:200px;height:57px}
h1{font:700 52px/1.05 var(--font-d);letter-spacing:-1.4px;margin-top:32px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--ink2);font-size:17px;max-width:460px;margin-top:-6px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:30px;background:var(--matte);border:1px solid var(--line);align-self:flex-start;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{height:44px;padding:0 14px;border-radius:22px;border:0;background:transparent;color:var(--ink2);font:600 15px/1 var(--font);display:flex;gap:8px;align-items:center;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.tabs button:hover{color:var(--ink)}.tabs button.on{background:#f5f5f7;color:#111}
.tabs button.soon{opacity:.55}
.card{background:var(--matte);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;max-width:460px;backdrop-filter:blur(30px)}
.row{display:flex;justify-content:space-between;gap:16px;font-size:14px}.row span:first-child{color:var(--ink3)}.row b{font-weight:600;text-align:right}
.card ul{padding-left:18px;color:var(--ink2);font-size:14px;display:flex;flex-direction:column;gap:4px}
.cap{font-size:13px;color:var(--ink3);margin-bottom:6px}
.btn{height:52px;padding:0 28px;border-radius:26px;background:#f5f5f7;color:#111;font:700 16px/1 var(--font);display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;text-decoration:none;white-space:nowrap;align-self:flex-start;transition:transform .2s,filter .2s}
.btn:hover{filter:brightness(.94)}.btn:active{transform:scale(.97)}
.btn.off{background:rgba(255,255,255,.08);color:var(--ink3);cursor:default}
.note{font-size:13px;color:var(--ink3);max-width:460px}
.note a{color:var(--ink2)}
.r{position:relative;min-height:560px}
.r img{position:absolute;left:0;top:80px;width:1000px;height:auto;max-width:none;border-radius:18px;border:1px solid var(--line);box-shadow:0 40px 100px rgba(0,0,0,.6)}
.skel{display:inline-block;width:60px;height:12px;border-radius:6px;background:rgba(255,255,255,.08)}
footer{grid-column:1/-1;font-size:13px;color:var(--ink3);display:flex;gap:16px;flex-wrap:wrap;padding-top:8px;position:relative;z-index:2}
@media (max-width:1000px){
  .page{grid-template-columns:1fr;padding:24px 16px 40px;gap:24px}
  h1{font-size:34px;letter-spacing:-.8px;margin-top:16px}
  .card,.sub,.note{max-width:none}
  .r{min-height:0}.r img{position:static;width:100%}
}
</style>
</head>

<main class="page">
  <div class="glow" style="right:-100px;top:-120px;width:760px;height:520px;background:rgba(110,155,255,.25)"></div>
  <div class="l">
    <span class="logo" role="img" aria-label="Пульс"><i class="w"></i><i class="s"></i></span>
    <h1>Один <em>пульс</em><br>на всех устройствах</h1>
    <p class="sub">Музыкальный плеер для Яндекс Музыки и своей коллекции — FLAC, MP3, CUE. Живой текст, «Мой пульс», статистика и достижения.</p>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="card" id="card" aria-live="polite"></div>

  win: { name: 'Windows', sys: 'Windows 10 и 11, 64 бит', extra: 'Обновляется сама', file: DL + '/latest/download/Pulse-Desktop-Alpha-Setup.exe', ver: '', size: 0, news: [] },
  and: { name: 'Android', sys: 'Android 8 и новее', extra: 'Обновляется сама', file: DL + '/tag/android', ver: '', size: 0, news: [] },
  mac: { name: 'macOS', soon: true },
  ios: { name: 'iPhone', soon: true },
};
const ORDER = ['win', 'and', 'mac', 'ios'];
const ua = navigator.userAgent;
let cur = /Android/i.test(ua) ? 'and' : /iPhone|iPad|iPod/i.test(ua) ? 'ios' : /Mac OS X/i.test(ua) && !/Mobile/i.test(ua) ? 'mac' : 'win';
const mb = (b) => (b ? Math.round(b / 1048576) + ' МБ' : '');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sk = '<span class="skel"></span>';
function tabs() {
  document.getElementById('tabs').innerHTML = ORDER.map((k) => `<button role="tab" aria-selected="${k === cur}" class="${k === cur ? 'on' : ''}${P[k].soon ? ' soon' : ''}" data-k="${k}">${IC[k]}${P[k].name}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach((b) => (b.onclick = () => { cur = b.dataset.k; tabs(); card(); }));
}
function card() {
  const p = P[cur], c = document.getElementById('card');
  if (p.soon) { c.innerHTML = `<div class="row"><span>${p.name}</span><b>Готовится</b></div><p class="note">Версия для ${p.name} в работе. А пока — Windows и Android.</p><span class="btn off">Скоро</span>`; return; }
  c.innerHTML = `<div class="row"><span>Версия</span><b>${p.ver ? esc(p.ver) : sk}</b></div>
    <div class="row"><span>Размер</span><b>${p.size ? mb(p.size) : sk}</b></div>
    <div class="row"><span>Система</span><b>${p.sys}</b></div>
    ${p.news.length ? `<div><div class="cap">Что нового</div><ul>${p.news.slice(0, 4).map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    <a class="btn" href="${p.file}" rel="noopener">${IC.dl}Скачать для ${p.name}</a>`;
}
const lines = (body) => String(body || '').split(/\r?\n/).map((s) => s.replace(/^\s*[•\-*]\s*/, '').trim()).filter((s) => s && !/^#/.test(s) && s.length < 200);
async function gh(path) {
  const k = 'pulse.site.' + path;
  try { const c = JSON.parse(localStorage.getItem(k) || 'null'); if (c && Date.now() - c.t < 10 * 60 * 1000) return c.v; } catch {}
  const r = await fetch('https://api.github.com/repos/' + REPO + path, { headers: { Accept: 'application/vnd.github+json' } });
  if (!r.ok) throw new Error(r.status);
  const v = await r.json(); try { localStorage.setItem(k, JSON.stringify({ t: Date.now(), v })); } catch {}
  return v;
}
async function load() {
  try {
    const d = await gh('/releases/latest');
    const exe = (d.assets || []).find((a) => /Setup\.exe$/i.test(a.name));
    P.win.ver = String(d.tag_name || '').replace(/^v/, ''); P.win.news = lines(d.body);
    if (exe) { P.win.size = exe.size; P.win.file = exe.browser_download_url; }
  } catch { P.win.ver = 'последняя'; }
  try {
    const a = await gh('/releases/tags/android');
    const apk = (a.assets || []).filter((x) => /\.apk$/i.test(x.name)).sort((x, y) => y.updated_at.localeCompare(x.updated_at))[0];
    if (apk) { P.and.size = apk.size; P.and.file = apk.browser_download_url; P.and.ver = (apk.name.match(/(\d+\.\d+\.\d+)/) || [])[1] || ''; }
    const notes = lines(a.body).filter((s) => !/Установите APK/.test(s)); if (notes.length) P.and.news = notes;
  } catch { P.and.ver = 'последняя'; }
  card();
}
tabs(); card(); load();
</script>
</body>
</html>
