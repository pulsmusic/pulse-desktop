<!doctype html><html><head><meta charset="utf-8"><title>test</title></head><body>
<script type="module">
import '../aligner.js';
window.runTest = async () => {
  const meta = await (await fetch('./song.json')).json();
  const audio = await (await fetch('./song.wav')).arrayBuffer();
  const res = await window.PulseAI.alignTrack({ audio: audio.slice(0), lines: meta.lines });
  // «Пересчитать» (как по кнопке): другие способы слушать, прошлая разметка — как заведомо неверная
  const res2 = await window.PulseAI.alignTrack({ audio: audio.slice(0), lines: meta.lines, scope: 'all', prev: res.lines });
  return { meta, res, res2 };
};
window.testReady = true;
</script></body></html>
