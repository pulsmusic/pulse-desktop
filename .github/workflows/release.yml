# Выпуск обновления «Пульса» для Windows.
# Срабатывает, когда в updates/ появляется новая версия (папка updates/<версия>/ с latest.json и pulse-app-<версия>.zip):
# находит самую новую версию, для которой ещё нет релиза, проверяет файлы (версия, размер, SHA-256) и создаёт релиз v<версия>.
# К релизу прикрепляются latest.json и пакет (их скачивает кнопка «Проверить обновления») и установщик — из папки версии,
# если он там есть, иначе из прошлого релиза (чтобы ссылка …/releases/latest всегда вела к установщику).
name: Выпуск обновления
on:
  push:
    branches: [main]
    paths: ['updates/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Новая версия
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=""
          for d in $(ls -d updates/*/ 2>/dev/null | xargs -n1 basename | sort -V); do
            gh release view "v$d" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || VER="$d"
          done
          echo "Новая версия: ${VER:-нет}"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: Проверка файлов
        if: steps.ver.outputs.ver != ''
        run: |
          VER="${{ steps.ver.outputs.ver }}"; DIR="updates/$VER"
          python3 - "$DIR" "$VER" <<'PY'
          import hashlib, json, sys
          d, v = sys.argv[1], sys.argv[2]
          m = json.load(open(f"{d}/latest.json", encoding="utf-8"))
          z = open(f"{d}/pulse-app-{v}.zip", "rb").read()
          assert m["version"] == v, "версия в latest.json не совпадает с папкой"
          assert m["sha256"] == hashlib.sha256(z).hexdigest(), "контрольная сумма не совпадает"
          assert m["size"] == len(z), "размер не совпадает"
          print("Файлы в порядке:", v, len(z), "байт")
          PY
      - name: Релиз
        if: steps.ver.outputs.ver != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"; DIR="updates/$VER"
          FILES=("$DIR/latest.json" "$DIR/pulse-app-$VER.zip")
          if [ -f "$DIR/Pulse-Desktop-Alpha-Setup.exe" ]; then
            FILES+=("$DIR/Pulse-Desktop-Alpha-Setup.exe")
          else
            PREV=$(gh release list -R "$GITHUB_REPOSITORY" --limit 30 --exclude-drafts --exclude-pre-releases --json tagName -q '.[0].tagName')
            if [ -n "$PREV" ]; then
              mkdir -p prev
              gh release download "$PREV" -R "$GITHUB_REPOSITORY" -p 'Pulse-Desktop-Alpha-Setup.exe' -D prev || true
              [ -f prev/Pulse-Desktop-Alpha-Setup.exe ] && FILES+=(prev/Pulse-Desktop-Alpha-Setup.exe)
            fi
          fi
          NOTES=$(python3 -c "import json,sys;print('\n'.join('• '+n for n in json.load(open(sys.argv[1], encoding='utf-8'))['notes']))" "$DIR/latest.json")
          gh release create "v$VER" "${FILES[@]}" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Пульс $VER" --notes "$NOTES" --latest
